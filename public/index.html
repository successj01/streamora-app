<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0f0f10" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO -->
    <meta
      name="description"
      content="Streamora — Watch live streams, discover creators, explore categories, and connect with your community."
    />

    <meta
      name="keywords"
      content="Streamora, live streaming, livestream, creators, gaming, music, entertainment, streaming platform"
    />

    <meta name="author" content="Streamora" />

    <!-- Application -->
    <meta
      name="application-name"
      content="Streamora"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Streamora"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/assets/streamora-logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/assets/streamora-logo.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Streamora — Watch. Stream. Connect."
    />

    <meta
      property="og:description"
      content="Discover live streams, follow creators, and connect with the Streamora community."
    />

    <meta
      property="og:image"
      content="%PUBLIC_URL%/assets/streamora-logo.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Streamora — Watch. Stream. Connect."
    />

    <meta
      name="twitter:description"
      content="Discover live streams, follow creators, and connect with the Streamora community."
    />

    <meta
      name="twitter:image"
      content="%PUBLIC_URL%/assets/streamora-logo.png"
    />

    <!-- Title -->
    <title>Streamora — Watch. Stream. Connect.</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run Streamora.
    </noscript>

    <div id="root"></div>
  </body>
</html>
